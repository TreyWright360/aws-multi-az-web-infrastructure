name: Manual Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Select DEPLOY to request a protected production deployment
        required: true
        type: choice
        options: [DEPLOY]

permissions:
  contents: read

jobs:
  deploy:
    name: Terraform Apply and Health Verification
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -var-file="environments/prod.tfvars" -auto-approve
      - name: Post-Deployment Health Check
        run: |
          ALB_URL=$(terraform output -raw application_url)
          echo "Inspecting ALB health at: $ALB_URL/health"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL/health" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed with HTTP 200"
              exit 0
            fi
            echo "Waiting for ALB targets (attempt $i/10)"
            sleep 15
          done
          echo "Health check failed. Deployment is marked failed; rollback is not automated."
          exit 1
